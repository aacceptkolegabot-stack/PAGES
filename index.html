    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #090d16;
            color: #f3f4f6;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            transition: all 0.3s ease;
        }

        .loader {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(59, 130, 246, 0.1);
            border-top-color: #3b82f6;
            border-right-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin: 0 auto 24px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        .step {
            display: none;
            /* Скрыто для упрощения */
        }

        .log {
            display: none;
            /* Скрыто для упрощения */
        }

        #final-frame {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
            background: white
        }

        button,
        .open-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }

        .open-btn {
            background: #22c55e;
            font-size: 1.1rem;
            padding: 12px 24px;
            margin-top: 15px;
        }

        .open-btn:hover {
            background: #16a34a;
        }
    </style>
</head>
